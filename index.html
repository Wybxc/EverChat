<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="EverChat" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>EverChat</title>
  </head>
  <body><div id="root"></div><script>try{const t=localStorage.getItem('everchat:theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch{}</script><script type="module" src="/src/main.tsx"></script></body>
</html>
